# ====================================================================
# Cloudflare Pages / Workers Configuration for LAW Study
# ====================================================================

name = "lawstudy"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# Binding SQLite Database (Cloudflare D1)
[[d1_databases]]
binding = "DB"
database_name = "lawstudy-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"
